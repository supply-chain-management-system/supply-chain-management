apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: supply-chain
  labels:
    app: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: shiyasdx/supply-chain-fastapi:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.core.celery.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "350Mi"
              cpu: "300m"
