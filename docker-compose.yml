version: "3.9"

services:

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  fastapi:
    build:
      context: ./server
    container_name: fastapi-server
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app

  ai_service:
  build:
    context: ./ai_services
  container_name: ai-microservice
  restart: always
  depends_on:
    - postgres
  env_file:
    - ./ai_services/.env
  environment:
    - PYTHONPATH=/server_code
  volumes:
    - ./ai_services:/app
    - ./server:/server_code
  ports:
    - "8001:8001"
  command: uvicorn ai_app.main:app --host 0.0.0.0 --port 8001 --reload
  nginx:
    image: nginx:latest
    container_name: api-gateway
    restart: always
    ports:
      - "8080:80"  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi
      - ai_service

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    depends_on:
      - postgres
    ports:
      - "5678:5678"
    env_file:
      - ./server/.env

    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
  mongo_data: