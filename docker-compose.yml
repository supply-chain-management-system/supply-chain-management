version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  fastapi:
    build:
      context: ./server
    container_name: fastapi-server
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    depends_on:
      - postgres
    ports:
      - "5678:5678"
    env_file:
      - ./server/.env

    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data: