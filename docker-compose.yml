
services:

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "5432:5432"
    volumes:
       - postgres_data:/var/lib/postgresql
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  fastapi:
    build:
      context: ./server
    container_name: fastapi-server
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app

  ai_service:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    container_name: ai-microservice
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./ai_services/.env
    environment:
      - PYTHONPATH=/app:/server_code
    volumes:
      # Only mount the specific code folders you are actively editing.
      # This prevents the local folders from overwriting the pre-installed libraries.
      - ./ai_services/ai_app:/app/ai_app
      - ./server:/server_code
    ports:
      - "8001:8001"
    command: uvicorn ai_app.main:app --host 0.0.0.0 --port 8001


  nginx:
    image: nginx:latest
    container_name: api-gateway
    restart: always
    ports:
      - "8080:80"  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi
      - ai_service

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    depends_on:
      - postgres
    ports:
      - "5678:5678"
    env_file:
      - ./server/.env
    # THIS LINE BELOW IS THE KEY FIX
    entrypoint: /bin/sh -c "sleep 15; n8n start"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
  mongo_data: