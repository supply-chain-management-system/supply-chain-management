events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
         
        # 1. Route AI Copilot requests to the AI Microservice
        location /api/v1/business-manager/copilot/ {
            proxy_pass http://ai_service:8001;
            proxy_set_header Host $http_host;  # <-- Updated
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Chat REST APIs to Chat Microservice
        location /api/v1/chat/ {
            proxy_pass http://chat_service:8002;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Chat WebSockets to Chat Microservice
        location /ws/chat/ {
            proxy_pass http://chat_service:8002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Route all other /api/v1/ requests to the Main FastAPI Server
        location /api/v1/ {
            proxy_pass http://fastapi:8000;
            proxy_set_header Host $http_host;  # <-- Only this one!
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Route Swagger UI Docs for the AI Service
        location /api/v1/ai-docs {
            proxy_pass http://ai_service:8001/api/v1/ai-docs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
        

        # 4. Route OpenAPI JSON schema for the AI Service
        location /api/v1/ai-openapi.json {
            proxy_pass http://ai_service:8001/api/v1/ai-openapi.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Route Swagger UI Docs for the Chat Service
        location /api/v1/chat-docs {
            proxy_pass http://chat_service:8002/api/v1/chat-docs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 6. Route OpenAPI JSON schema for the Chat Service
        location /api/v1/chat-openapi.json {
            proxy_pass http://chat_service:8002/api/v1/chat-openapi.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}