events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
         
        # 1. Route AI Copilot requests to the AI Microservice
        location /api/v1/business-manager/copilot/ {
            proxy_pass http://ai_service:8001;
            proxy_set_header Host $http_host;  # <-- Updated
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Route all other /api/v1/ requests to the Main FastAPI Server
        location /api/v1/ {
            proxy_pass http://fastapi:8000;
            proxy_set_header Host $http_host;  # <-- Only this one!
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        

        location /ai-docs/{
            proxy_pass http://ai_service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
        

        # 4. Route OpenAPI JSON schema (Swagger needs this to load the UI)
        location /openapi.json {
            proxy_pass http://ai_service:8001/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}